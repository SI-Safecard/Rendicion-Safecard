<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--br:#E8541A;--bg:#F3F4F6;--bd:#D6DEE7;--tx:#1E2A38;--mt:#64748B;--sf:#FFFFFF;--gn:#22C55E}
html,body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',Arial,sans-serif;min-height:100%}
header{background:var(--br);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
header img{height:34px}
header .ico{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
header h1{font-size:15px;font-weight:800;line-height:1.2}
header p{font-size:11px;opacity:.9}
main{max-width:600px;margin:0 auto;padding:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:10px;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.4px}
.f input,.f select,.f textarea{border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--tx);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--br)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--br);color:#fff}
.btn-secondary{background:#EEF2F6;color:var(--tx);border:1px solid var(--bd)}
.btn-green{background:var(--gn);color:#fff}
.btn-sm{padding:8px 10px;font-size:12px;width:auto}
.btn[disabled]{opacity:.55;cursor:not-allowed}
#msg{font-size:13px;font-weight:600;margin-top:8px;text-align:center}
#msg.ok{color:#15803D}#msg.err{color:#B91C1C}#msg.info{color:var(--mt)}
.hidden{display:none}
input[type=file]{display:none}
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:10px}
.foto-thumb{position:relative;border-radius:8px;overflow:hidden;background:#f0f0f0;aspect-ratio:1/1}
.foto-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.foto-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:16px}
.foto-modal.show{display:flex}
.foto-modal img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.foto-modal .cerrar{position:absolute;top:16px;right:16px;background:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;font-weight:700;cursor:pointer}
.foto-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;cursor:pointer;line-height:1}
.boleta-card{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafbfc}
.boleta-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.boleta-head b{font-size:13px;flex:1}
.boleta-head .estado{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.estado-pendiente{background:#FEF3C7;color:#92400E}
.estado-ok{background:#DCFCE7;color:#15803D}
.estado-err{background:#FEE2E2;color:#B91C1C}
.rm-boleta{background:none;border:none;color:var(--mt);font-size:13px;cursor:pointer;padding:4px}
#addFotoBtn{margin-bottom:12px}
</style>
</head>

  <div><h1>Rendición de Gastos</h1><p>Safecard</p></div>
</header>

<main>

  <div class="card">
    <h2>📋 Datos generales</h2>
    <div class="f">
      <label>Responsable</label>
      <select id="responsable"></select>
    </div>
    <div class="f">
      <label>Proyecto (opcional, aplica a todas las boletas de esta tanda)</label>
      <input id="proyecto" type="text" placeholder="Nombre del proyecto, si corresponde">
    </div>
  </div>

  <input type="file" id="fileFoto" accept="image/*" multiple>
  <div class="card" style="padding:12px">
    <button class="btn btn-primary" id="addFotoBtn" onclick="document.getElementById('fileFoto').click()">➕ Agregar boleta (foto nueva)</button>
    <button class="btn btn-secondary hidden" id="btnAnalizarTodas" onclick="analizarTodas()" style="margin-top:8px">🔍 Analizar todas con IA</button>
    <button class="btn btn-secondary hidden" id="btnCargar" onclick="cargarEnPlanilla()" style="margin-top:8px">📥 Cargar en planilla (validar)</button>
    <button class="btn btn-green hidden" id="btnEnviarTodas" onclick="enviarCorreoFinal()" style="margin-top:8px">📨 Enviar correo</button>
  </div>

  <div id="boletasList"></div>

  <div id="msg"></div>

</main>

<div class="foto-modal" id="fotoModal" onclick="cerrarFotoGrande()">
  <button class="cerrar" onclick="cerrarFotoGrande()">✕</button>
  <img id="fotoModalImg" src="" onclick="event.stopPropagation()">
</div>
<datalist id="descripcionesList"></datalist>

<script>
window.RENDICION_ENDPOINT = "https://script.google.com/macros/s/AKfycbzeFGW-oENm4Jk47xEmW3c-CsDqvQXzsdN3uluQfQZV0DV6etIhmOR8PPuo3TYlIEV_AA/exec";

const RESPONSABLES = ["Francisco Morales","Ciro Forte","Ariel Lazo","Jhon Villegas","Sebastian Espinoza","Pedro Rivera","Matias Silva","Fabian Pavez","Nicolas Jara","Pablo Abarca"];
const DESCRIPCIONES = ["Estacionamiento","Alimentación","Materiales","Combustible","Peaje","Herramienta","Blue Max","Estadía"];
document.getElementById('descripcionesList').innerHTML = DESCRIPCIONES.map(op=>`<option value="${op}">`).join('');

const sel = document.getElementById('responsable');
sel.innerHTML = RESPONSABLES.map(n=>`<option value="${n}">${n}</option>`).join('');
try{
  const qp = new URLSearchParams(location.search);
  const pre = qp.get('resp');
  if(pre && RESPONSABLES.includes(pre)) sel.value = pre;
}catch(e){}

let boletas = []; // {id, fotos:[{base64,mime}], datos:{fecha,periodo,tipoDocumento,monto,cuenta,proveedor,numeroDocumento,descripcion}, estado:'pendiente'|'ok'|'err', errMsg}
let nextId = 1;
const hoy = new Date().toISOString().slice(0,10);

function nuevoDatosVacios(){
  return {fecha:hoy, periodo:hoy.slice(0,7), tipoDocumento:'Boleta', monto:'', cuenta:'Gastos Safecard', proveedor:'', numeroDocumento:'', descripcion:''};
}

function esHeic(file){
  const t=(file.type||'').toLowerCase();
  return t==='image/heic' || t==='image/heif' || /\.(heic|heif)$/i.test(file.name||'');
}
async function archivoAJpegSiHaceFalta(file){
  if(!esHeic(file)) return file;
  try{
    const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
    return blob instanceof Blob ? blob : blob[0];
  }catch(e){
    console.warn('No se pudo convertir HEIC, se intenta usar el original:', e);
    return file;
  }
}

document.getElementById('fileFoto').addEventListener('change', async function(){
  const files = Array.from(this.files || []);
  if(!files.length) return;
  this.disabled = true;
  // Cada foto elegida es una boleta independiente. Se procesan de a una, en el
  // orden elegido, para que en cargas masivas no se desordenen ni se sature
  // el navegador convirtiendo muchas fotos HEIC al mismo tiempo.
  for(let i=0;i<files.length;i++){
    const file = files[i];
    if(files.length>1) setMsg(`Procesando foto ${i+1} de ${files.length}…`,'info');
    const b = { id: nextId++, fotos: [], datos: nuevoDatosVacios(), estado: 'pendiente', errMsg:'' };
    const usable = await archivoAJpegSiHaceFalta(file);
    await new Promise(resolve=>{
      const reader = new FileReader();
      reader.onload = function(){
        b.fotos.push({ base64: reader.result.split(',')[1], mime: usable.type || 'image/jpeg' });
        boletas.push(b);
        renderBoletas();
        resolve();
      };
      reader.onerror = function(){ resolve(); };
      reader.readAsDataURL(usable);
    });
  }
  if(files.length>1) setMsg(`✅ ${files.length} foto(s) agregada(s) como boletas separadas.`,'ok');
  this.disabled = false;
  this.value = '';
});

function quitarFoto(boletaId, idx){
  const b = boletas.find(x=>x.id===boletaId);
  if(!b) return;
  b.fotos.splice(idx,1);
  if(!b.fotos.length) boletas = boletas.filter(x=>x.id!==boletaId);
  renderBoletas();
}
function quitarBoleta(boletaId){
  boletas = boletas.filter(x=>x.id!==boletaId);
  renderBoletas();
}
function actualizarCampo(boletaId, campo, valor){
  const b = boletas.find(x=>x.id===boletaId);
  if(!b) return;
  b.datos[campo] = valor;
  if(campo==='fecha') b.datos.periodo = (valor||hoy).slice(0,7);
}

function renderBoletas(){
  const cont = document.getElementById('boletasList');
  cont.innerHTML = boletas.map((b,i)=>{
    const d = b.datos;
    const estadoCls = b.estado==='ok' ? 'estado-ok' : (b.estado==='err' ? 'estado-err' : 'estado-pendiente');
    const estadoTxt = b.estado==='ok' ? '✅ Leída por IA' : (b.estado==='err' ? '⚠️ Revisar manual' : '⏳ Pendiente de analizar');
    return `<div class="boleta-card">
      <div class="boleta-head">
        <b>Boleta #${i+1}</b>
        <span class="estado ${estadoCls}">${estadoTxt}</span>
        <button class="rm-boleta" onclick="quitarBoleta(${b.id})">🗑️</button>
      </div>
      <div class="fotos-grid">
        ${b.fotos.map((f,fi)=>`<div class="foto-thumb"><img src="data:${f.mime};base64,${f.base64}" onclick="verFotoGrande('data:${f.mime};base64,${f.base64}')"><button class="rm" onclick="event.stopPropagation();quitarFoto(${b.id},${fi})">✕</button></div>`).join('')}
      </div>
      <div class="row2">
        <div class="f"><label>Fecha</label><input type="date" value="${d.fecha||''}" onchange="actualizarCampo(${b.id},'fecha',this.value)"></div>
        <div class="f"><label>Monto ($)</label><input type="number" inputmode="numeric" value="${d.monto||''}" placeholder="0" onchange="actualizarCampo(${b.id},'monto',this.value)"></div>
      </div>
      <div class="row2">
        <div class="f"><label>Tipo de Documento</label>
          <select onchange="actualizarCampo(${b.id},'tipoDocumento',this.value)">
            <option ${d.tipoDocumento==='Boleta'?'selected':''}>Boleta</option>
            <option ${d.tipoDocumento==='Factura'?'selected':''}>Factura</option>
          </select>
        </div>
        <div class="f"><label>Descripción</label>
          <input type="text" list="descripcionesList" value="${(d.descripcion||'').replace(/"/g,'&quot;')}" placeholder="Elige o escribe una" onchange="actualizarCampo(${b.id},'descripcion',this.value)">
        </div>
      </div>
      <div class="f"><label>Cuenta</label>
        <input type="text" value="Gastos Safecard" disabled style="background:#EEF2F6;color:var(--mt)">
      </div>
      <div class="f"><label>Proveedor</label><input type="text" value="${(d.proveedor||'').replace(/"/g,'&quot;')}" placeholder="Nombre del comercio" onchange="actualizarCampo(${b.id},'proveedor',this.value)"></div>
      <div class="f"><label>N° Documento</label><input type="text" value="${(d.numeroDocumento||'').replace(/"/g,'&quot;')}" placeholder="Folio / N°" onchange="actualizarCampo(${b.id},'numeroDocumento',this.value)"></div>
      ${b.errMsg ? `<div style="font-size:11px;color:#B91C1C;margin-top:4px">${b.errMsg}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('btnAnalizarTodas').classList.toggle('hidden', boletas.length===0);
  document.getElementById('btnCargar').classList.toggle('hidden', boletas.length===0);
  document.getElementById('btnEnviarTodas').classList.toggle('hidden', boletas.length===0);
}

function setMsg(txt, cls){
  const m = document.getElementById('msg');
  m.textContent = txt; m.className = cls||'';
}
function verFotoGrande(dataUrl){
  document.getElementById('fotoModalImg').src = dataUrl;
  document.getElementById('fotoModal').classList.add('show');
}
function cerrarFotoGrande(){
  document.getElementById('fotoModal').classList.remove('show');
}

function mejorCategoria(txt){
  if(!txt) return '';
  const norm = String(txt).toLowerCase();
  const found = DESCRIPCIONES.find(op => op.toLowerCase()===norm);
  return found || '';
}

async function analizarUna(b){
  try{
    const res = await fetch(window.RENDICION_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({accion:'extraer', fotos: b.fotos.map(f=>({data:f.base64, mimeType:f.mime}))})
    });
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data&&data.error)||'error desconocido');
    const dt = data.datos || {};
    b.datos.fecha = dt.fecha || b.datos.fecha;
    b.datos.periodo = (dt.fecha || b.datos.fecha || hoy).slice(0,7);
    b.datos.tipoDocumento = dt.tipoDocumento || b.datos.tipoDocumento;
    b.datos.monto = dt.monto || b.datos.monto;
    b.datos.proveedor = dt.proveedor || b.datos.proveedor;
    b.datos.numeroDocumento = dt.numeroDocumento || b.datos.numeroDocumento;
    b.datos.descripcion = mejorCategoria(dt.descripcion) || b.datos.descripcion;
    b.estado = 'ok'; b.errMsg = '';
  }catch(e){
    b.estado = 'err'; b.errMsg = 'No se pudo leer con IA: '+(e.message||e)+'. Complétala a mano.';
  }
}

function validarBoletas(){
  if(!boletas.length){ setMsg('Agrega al menos una boleta.','err'); return false; }
  for(const b of boletas){
    if(!b.datos.fecha || !b.datos.proveedor || !b.datos.monto){
      setMsg('Completa al menos Fecha, Proveedor y Monto en todas las boletas.','err');
      return false;
    }
  }
  return true;
}

function armarDocumentos(){
  return boletas.map(b=>({
    fecha:b.datos.fecha, periodo:b.datos.periodo, cuenta:b.datos.cuenta,
    tipoDocumento:b.datos.tipoDocumento, proveedor:b.datos.proveedor,
    numeroDocumento:b.datos.numeroDocumento, descripcion:b.datos.descripcion,
    monto:b.datos.monto, fotos: b.fotos.map(f=>({data:f.base64, mimeType:f.mime}))
  }));
}

async function postConReintento(payload){
  try{
    const res = await fetch(window.RENDICION_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data && data.ok) return {ok:true, data};
    throw new Error((data&&data.error)||'Respuesta inválida.');
  }catch(networkErr){
    try{
      await fetch(window.RENDICION_ENDPOINT, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
      return {ok:true, sinConfirmar:true, data:{}};
    }catch(e2){
      return {ok:false, error:e2.message||String(e2)};
    }
  }
}

async function analizarTodas(){
  const btn = document.getElementById('btnAnalizarTodas');
  const orig = btn.textContent;
  btn.disabled = true;
  // OpenRouter gratis permite ~20 solicitudes por minuto EN TOTAL (compartidas entre modelos).
  // Mandar ráfagas más grandes que eso solo provoca que nos autobloqueemos con más 429.
  const CONCURRENCIA = 2;
  const ESPERA_ENTRE_LOTES_MS = 3200; // ritmo ~ dentro del límite de 20/min
  let hechas = 0;
  const totalLotes = Math.ceil(boletas.length/CONCURRENCIA);
  if(boletas.length>15) setMsg(`Analizando ${boletas.length} boleta(s). Con el nivel gratuito esto puede tardar unos minutos (límite de ~20 por minuto) — no cierres la pestaña.`,'info');
  for(let i=0;i<boletas.length;i+=CONCURRENCIA){
    const lote = boletas.slice(i, i+CONCURRENCIA);
    const loteNum = Math.floor(i/CONCURRENCIA)+1;
    btn.textContent = `⏳ Analizando ${Math.min(i+CONCURRENCIA,boletas.length)}/${boletas.length}…`;
    await Promise.all(lote.map(b=>analizarUna(b)));
    hechas += lote.length;
    renderBoletas();
    setMsg(`Analizando… ${Math.min(hechas,boletas.length)}/${boletas.length}`,'info');
    if(loteNum<totalLotes) await new Promise(r=>setTimeout(r, ESPERA_ENTRE_LOTES_MS));
  }
  btn.disabled = false; btn.textContent = orig;
  setMsg('Listo — revisa los datos de cada boleta antes de cargarlas.','ok');
}

async function cargarEnPlanilla(){
  if(!validarBoletas()) return;
  const btn = document.getElementById('btnCargar');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Cargando en la planilla…';
  setMsg('Cargando en tu planilla de Drive…','info');

  const payload = { accion:'cargar', responsable: sel.value, proyecto: document.getElementById('proyecto').value.trim(), documentos: armarDocumentos() };
  const r = await postConReintento(payload);

  if(!r.ok){
    setMsg('No se pudo cargar en la planilla: '+r.error,'err');
  }else if(r.sinConfirmar){
    setMsg('Se envió la carga, pero no se pudo confirmar la respuesta — revisa igual la planilla en Drive antes de enviar el correo.','ok');
  }else{
    const url = r.data.sheetUrl;
    setMsg('✅ '+(r.data.guardadas||boletas.length)+' boleta(s) cargada(s) en tu planilla.'+(r.data.warn?(' '+r.data.warn):'')+' '+(url?('Ábrela y revísala: '+url):'')+' Cuando esté todo correcto, presiona "Enviar correo".', 'ok');
  }
  btn.disabled = false; btn.textContent = orig;
}

async function enviarCorreoFinal(){
  if(!validarBoletas()) return;
  const btn = document.getElementById('btnEnviarTodas');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ Enviando correo…';
  setMsg('Enviando correo…','info');

  const payload = { accion:'enviarCorreo', responsable: sel.value, proyecto: document.getElementById('proyecto').value.trim(), documentos: armarDocumentos() };
  const r = await postConReintento(payload);

  if(!r.ok){
    setMsg('No se pudo enviar el correo: '+r.error,'err');
  }else{
    setMsg(r.sinConfirmar ? '✅ Enviado (sin confirmación del servidor).' : ('✅ Correo enviado con '+boletas.length+' boleta(s).'), 'ok');
    boletas = [];
    renderBoletas();
    document.getElementById('fileFoto').value='';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  btn.disabled = false; btn.textContent = orig;
}
</script>
